<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <pattern id="dotPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity="0.4"/>
    </pattern>
  </defs>
  
  <!-- Main Card Body -->
  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="2"/>
  <rect width="100%" height="100%" rx="16" fill="url(#dotPattern)"/>
  
  <!-- Left Accent Bar -->
  <rect x="0" y="0" width="6" height="340" rx="3" fill="#b91c1c"/>
  
  <!-- Header Bar -->
  <rect x="24" y="24" width="150" height="26" rx="13" fill="#fef2f2" stroke="#fee2e2"/>
  <text x="36" y="41" fill="#991b1b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="0.8">RESEARCH ARTICLE</text>
  <text x="570" y="41" text-anchor="end" fill="#64748b" font-family="ui-monospace, monospace" font-size="11" font-weight="600">DOI: 10.1101/2025.10.17.683039</text>
  
  <!-- Center Graphic: Academic / Structural Biology Seal -->
  <g transform="translate(250, 80)">
    <circle cx="50" cy="50" r="44" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="50" cy="50" r="36" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M36 50 L64 50 M50 36 L50 64 M40 40 L60 60 M40 60 L60 40" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="7" fill="#991b1b"/>
    <circle cx="36" cy="50" r="3.5" fill="#475569"/>
    <circle cx="64" cy="50" r="3.5" fill="#475569"/>
    <circle cx="50" cy="36" r="3.5" fill="#475569"/>
    <circle cx="50" cy="64" r="3.5" fill="#475569"/>
  </g>
  
  <!-- Journal Name -->
  <text x="300" y="208" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">Peer-Reviewed Journal</text>
  
  <!-- Article Title snippet -->
  <text x="300" y="232" text-anchor="middle" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">A Novel Unorthodox Dimeric Primary Enoyl-CoA Reductase Structure</text>
  
  <!-- Footer Badge -->
  <rect x="150" y="265" width="300" height="32" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="300" y="285" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Access Full Text &amp; Figures via Publisher (2025)</text>
</svg>